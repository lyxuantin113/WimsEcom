version: '3.8'
services:
  # 1. APP BACKEND
  backend-app:
    image: tinly2kin/wims-backend:v1.0
    container_name: wims-backend-prod
    restart: always
    ports:
      - "80:8080" # Mở cổng 80 (Cổng Web mặc định) trỏ vào 8080 của App
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresdb:5432/wims_db}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:root}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - SPRING_DATA_REDIS_PASSWORD=${SPRING_DATA_REDIS_PASSWORD}
      - SPRING_DATA_REDIS_REPOSITORIES_ENABLED=false
      - SPRING_DATA_REDIS_SSL_ENABLED=true
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - CLOUDINARY_SECRET=${CLOUDINARY_SECRET}
      - CLOUDINARY_NAME=${CLOUDINARY_NAME}
      - CLOUDINARY_KEY=${CLOUDINARY_KEY}
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FE_BASE_URL=${FE_URL}
      # Nếu có cấu hình Cloudinary/Mail
    networks:
      - wims-network

networks:
  wims-network:
    driver: bridge
