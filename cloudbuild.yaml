steps:
  # 1. Build JAR với Maven
  - name: 'maven:3.9.6-amazoncorretto-21-al2023'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-DskipTests']

  # 2. Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/wims-backend', '.']

  # 3. Push Docker Image lên Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/wims-backend']

  # 4. Deploy lên Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wims-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wims-backend'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SPRING_PROFILES_ACTIVE=prod,GCP_PROJECT_ID=$PROJECT_ID,CLOUD_SQL_CONNECTION_NAME=${_CLOUD_SQL_CONNECTION_NAME},SPRING_DATASOURCE_DB_NAME=${_DB_NAME},SPRING_DATASOURCE_USERNAME=${_DB_USER},SPRING_DATA_REDIS_HOST=${_REDIS_HOST},FE_URL=${_FE_URL},CLOUDINARY_NAME=${_CLOUDINARY_NAME},CLOUDINARY_KEY=${_CLOUDINARY_KEY},VNP_TMN_CODE=${_VNP_TMN_CODE}'
      - '--set-secrets'
      - 'SPRING_DATASOURCE_PASSWORD=WIMS_DB_PASS:latest,SPRING_DATA_REDIS_PASSWORD=WIMS_REDIS_PASS:latest,JWT_SECRET_KEY=WIMS_JWT_SECRET:latest,CLOUDINARY_SECRET=WIMS_CLOUDINARY_SECRET:latest,MAIL_PASSWORD=WIMS_MAIL_PASS:latest,VNP_HASH_SECRET=WIMS_VNP_HASH_SECRET:latest'

images:
  - 'gcr.io/$PROJECT_ID/wims-backend'

substitutions:
  _CLOUD_SQL_CONNECTION_NAME: 'wims-backend-xuantin:asia-southeast1:wims-db'
  _DB_NAME: 'postgres'
  _DB_USER: 'postgres'
  _REDIS_HOST: 'curious-emu-23935.upstash.io'
  _FE_URL: 'https://wims-ecom-fe.vercel.app/'
  _CLOUDINARY_NAME: 'dfdyfg6bd'
  _CLOUDINARY_KEY: '374153475555556'
  _VNP_TMN_CODE: 'EP00AIH4'
