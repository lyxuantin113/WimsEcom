spring:
  application:
    name: wims-backend-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

cloudinary:
  cloudname: mock-cloudname
  key: mock-key
  secret: mock-secret
  secure: true

vnpay:
  payurl: "mock-url"
  returnurl: "mock-url"
  tmncode: "mock"
  hashsecret: "mock"
  apiurl: "mock-url"

frontend:
  baseurl: "http://localhost:5173"

jwt:
  secretkey: "mock-secret-key-for-test-needs-to-be-long-enough"
  expiration: "60000"

MAIL_PASSWORD: "mock-password"
