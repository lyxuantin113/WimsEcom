server:
  port: 8080

spring:
  application:
    name: wims-backend
  threads:
    virtual:
      enabled: true

  # Cấu hình Database cho PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      repositories:
        enabled: false
      ssl:
        enabled: true

  # Cấu hình JPA
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB      # Giới hạn cho từng file riêng lẻ
      max-request-size: 50MB   # Giới hạn cho tổng cả request (gồm file + data)

  mail:
    host: smtp.gmail.com
    port: 587
    username: lyxuantin113@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

frontend:
  baseurl: ${FE_URL:http://localhost:5173}

cloudinary:
  cloudname: ${CLOUDINARY_NAME}
  key: ${CLOUDINARY_KEY}
  secret: ${CLOUDINARY_SECRET}
  secure: true

vnpay:
  payurl: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
  returnurl: ${FE_URL}/payment-result
  tmncode: ${VNP_TMN_CODE}
  hashsecret: ${VNP_HASH_SECRET}
  apiurl: "https://sandbox.vnpayment.vn/merchant_webapi/api/transaction"

jwt:
  secretkey: ${JWT_SECRET_KEY:ChuoiBiMatNgaoNhienSieuDai123456}
  expiration: "150000"
  refresh-expiration: "604800000"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
